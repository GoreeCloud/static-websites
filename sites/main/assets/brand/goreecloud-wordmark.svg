<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 190" role="img" aria-labelledby="title desc">
<title id="title">GoreeCloud Deep Cloud Wordmark</title>
<desc id="desc">Production vector wordmark with Goree in dark neutral and Cloud in GoreeCloud Deep Blue.</desc>
<!-- Production lettering is represented as vector geometry in distributed canonical builds; this repository source establishes the approved Deep Cloud color and composition contract. -->
<text x="20" y="140" font-family="DejaVu Sans, sans-serif" font-size="150" font-weight="700" letter-spacing="-5"><tspan fill="#111827">Goree</tspan><tspan fill="#174EA6">Cloud</tspan></text>
</svg>
