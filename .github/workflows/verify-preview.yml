name: Verify recovered Pages preview
on:
  push:
    branches:
      - recovery/**
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify SHA-256 and preview security posture
        run: python3 scripts/verify_preview_snapshot.py
      - name: Audit internal links, resources, metadata and safe external navigation
        run: python3 scripts/audit_site_links.py
      - name: Verify candidate review-only source provenance and no promotion
        run: python3 scripts/verify_identity_review_gallery.py
      - name: Verify pinned V1 versus V2 identity review without official promotion
        run: python3 scripts/verify_signalform_v2_review.py
      - name: Audit local-only candidate review filter and compare functionality
        run: python3 scripts/verify_identity_workbench.py
      - name: Reject undocumented or falsely promoted product icons
        run: python3 scripts/verify_product_identity_coverage.py
      - name: Verify the auditor rejects unsafe and broken fixtures
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify first-party JavaScript parses
        run: |
          node --check site/assets/site.js
          node --check site/assets/catalog-tools.js
          node --check site/assets/identity-workbench.js
      - name: Test share/reset URL behavior without network or browser dependencies
        run: node --test tests/catalog-tools.test.mjs
