name: Validate main GoreeCloud website

on:
  pull_request:
    paths:
      - 'sites/main/**'
      - '.github/workflows/validate-main-site.yml'
  push:
    branches: [main]
    paths:
      - 'sites/main/**'
      - '.github/workflows/validate-main-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact website candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out pinned Glaze UI V1.6.0 Stable authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GoreeCloud/glaze-ui
          ref: 081527eff1c5fe5001b6b9598d60439c8fb3c5e3
          path: .glaze-ui
          persist-credentials: false

      - name: Confirm generated artifact is not source authority
        run: test ! -e sites/main/dist

      - name: Compile website validation tools
        run: |
          python -m py_compile             sites/main/scripts/build_public_site.py             sites/main/scripts/validate_build_artifact.py             sites/main/scripts/validate_site.py             sites/main/scripts/validate_public_surface.py             sites/main/scripts/validate_glaze_ui.py             sites/main/scripts/browser_artifact_smoke.py \
            scripts/validate_url_namespace.py

      - name: Validate current public truth and URL surface
        run: |
          python scripts/validate_url_namespace.py
          python sites/main/scripts/validate_site.py
          python sites/main/scripts/validate_public_surface.py

      - name: Validate current Glaze UI target against pinned authority
        env:
          GLAZE_UI_SOURCE: ${{ github.workspace }}/.glaze-ui
        run: python sites/main/scripts/validate_glaze_ui.py

      - name: Build isolated one-site artifact
        run: python sites/main/scripts/build_public_site.py

      - name: Validate exact artifact bytes and public boundary
        run: python sites/main/scripts/validate_build_artifact.py

      - name: Exercise the canonical pages in Chrome
        run: python sites/main/scripts/browser_artifact_smoke.py

      - name: Check current JavaScript syntax
        run: |
          node --check sites/main/js/theme-init-v8.js
          node --check sites/main/js/site-v8.js

      - name: Preserve production acceptance boundary
        run: |
          echo "Source/build/browser checks do not establish deployment or production acceptance."
          echo "Production verification remains a separately authorized post-merge gate."
