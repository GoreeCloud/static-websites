name: GoreeCloud website source quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goreecloud-site-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact source without retaining credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run dependency-free homepage acceptance tests
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace and changeset integrity
        run: git diff --check HEAD
